services:
  postgres:
    image: postgres:16-alpine
    container_name: grasyn-postgres
    environment:
      POSTGRES_USER: grasyn
      POSTGRES_PASSWORD: grasyn
      POSTGRES_DB: grasyn
    ports:
      - "5432:5432"
    volumes:
      - grasyn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grasyn -d grasyn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grasyn_pg:
