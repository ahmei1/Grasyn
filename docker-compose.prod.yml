services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grasyn
      POSTGRES_PASSWORD: grasyn
      POSTGRES_DB: grasyn
    volumes:
      - grasyn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grasyn -d grasyn"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://grasyn:grasyn@postgres:5432/grasyn
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production-use-a-long-random-string}
      JWT_ACCESS_EXPIRES: 15m
      REFRESH_EXPIRES_DAYS: 7
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  grasyn_pg:
